<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/dist/main.css" rel="stylesheet">
    <link href="../src/styles.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="  rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Anushka Sharma</title>
</head>
<body class="font-body text-neutral-900 bg-neutral-100">     
    <!--Navbar-->
    <nav class="mx-40">
        <div class="container flex flex-wrap justify-between items-center mt-6 mb-6">
            <a href="index.html" class="font-logo text-h2 text-neutral-900">
                A.
            </a>
            <div class="hidden w-full md:block md:w-auto" id="navbar-default">
                <ul class="flex flex-col md:flex-row">
                    <li>
                        <a href="index.html" class="block text-neutral-900 text-p mr-6 font-semibold border border-t-0 border-l-0 border-r-0 border-b-2 border-neutral-900" aria-current="page">
                            Work
                        </a>
                    </li>
                    <li>
                        <a href="about.html" class="block text-neutral-700 mr-6 text-p font-regular" aria-current="page">
                            About
                        </a>
                    </li>
                    <li>
                        <a href="assets/AnushkaSharma.pdf" class="text-p text-neutral-700 font-regular mx-6" aria-current="page">
                            Resume
                        </a>
                    </li>
                    <li>
                        <a href="visuals.html" class="block text-neutral-700 text-p font-regular" aria-current="page">
                            Visuals
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!--Photography-->
    <section>
        <div class="bg-black">
            <h2 class="font-logo text-h2 text-center p-40 text-neutral-100">photography.</h2>
        </div>
    </section>

    <!--Photos-->
    <div class="lg:mx-40 my-20">
        <!--Image grid-->
        <div class="grid grid-cols-3 gap-6 mt-6" id="lightgallery">    
            <!--Image 1-->  
            <img 
                class="w-full h-full object-cover cursor-pointer" 
                src="../dist/assets/bird-silhouette.jpg" 
                alt="bird-silhouette" 
                onclick="showModal('../dist/assets/bird-silhouette.jpg')" 
            />  
            <!--Image 2-->
            <img 
                class="w-full h-full object-cover cursor-pointer" 
                src="../dist/assets/annapurna.jpg" 
                alt="Annapurna Mountain" 
                onclick="showModal('../dist/assets/annapurna.jpg')" 
            />   
             <!--Image -->
             <img 
             class="w-full h-full object-cover cursor-pointer" 
             src="../dist/assets/Daisy.jpg" 
             alt="Daisy Bee on Flower" 
             onclick="showModal('../dist/assets/Daisy.jpg')" 
            />     
               
            <!--Image 4-->
            <img 
                class="w-full h-full object-cover cursor-pointer" 
                src="../dist/assets/Lakhbatti.jpg" 
                alt="Lakhbatti" 
                onclick="showModal('../dist/assets/Lakhbatti.jpg')" 
            />   
        </div>
        <div id="modal" class="hidden fixed top-0 left-0 z-80 w-screen h-screen flex justify-center items-center bg-black/70">
            <a 
                class="fixed z-90 top-6 right-9 text-neutral-100 text-p" 
                href="javascript:void(0)"
                onclick="closeModal()" />
                <!--Close icon-->
                <i class="fa-solid fa-xmark"></i>
            </a>
            <img id="modal-img" class="max-w-[800px] max-h-[600px] object-cover" />
        </div>
    </div>
    

    <!-- Footer -->
    <div class="mt-20 lg:mx-40">
        <hr class="h-px bg-neutral-300">
        <div class="grid grid-cols-2 gap-6 my-6">
            <div>
                <p class="text-sm text-neutral-800 font-light">Designed by Anushka Sharma. All rights reserved.</p>
            </div>
            <div class="col-start-10 col-span-2">
                <a class="px-4" href="https://github.com/AnushkaaSharma"><i class="fa-brands fa-github fa-lg"></i></a>
                <a href="https://github.com/AnushkaaSharma"><i class="fa-solid fa-basketball fa-lg"></i></a>
            </div>
        </div>
    </div>

    <!--JS for images-->
    <script>
        // Get the modal by id
        var modal = document.getElementById("modal");

        // Get the modal image tag
        var modalImg = document.getElementById("modal-img");

        // this function is called when a small image is clicked
        function showModal(src) {
            modal.classList.remove('hidden');
            modalImg.src = src;
        }

        // this function is called when the close button is clicked
        function closeModal() {
            modal.classList.add('hidden');
        }
    </script>  
</body>
</html>
